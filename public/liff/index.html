<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>妍序 Skin 線上預約</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --bg:#FBF3F1; --surface:#FFFDFB; --surface-2:#F6E9E8; --border:#E9D3D2;
    --text:#3A2A2C; --text-muted:#9C7C7C; --accent:#C57C82; --accent-strong:#A65A61;
    --accent-soft:#F1D9D8; --gold:#C79A5B; --sage:#6F8F6B; --sage-soft:#E1EBDD; --danger:#B3453A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--text); font-family:'PingFang TC','Microsoft JhengHei',sans-serif;
    background-color:#FBF1EF;
    background-image:
      radial-gradient(ellipse 700px 500px at 0% -10%, #FCE7E4 0%, transparent 55%),
      radial-gradient(ellipse 700px 500px at 100% 0%, #F3E0DA 0%, transparent 55%);
    background-attachment:fixed;
  }
  .wrap{ max-width:480px; margin:0 auto; padding:22px 16px 40px; }
  /* 電腦瀏覽器打開時視窗比較寬，放寬版面讓本週時段表格不用捲動也看得完整 */
  @media (min-width:600px){ .wrap{ max-width:620px; } }

  .brand{ text-align:center; margin-bottom:6px; }
  .brand .word{
    font-family:'Noto Serif TC','PingFang TC',serif; font-size:26px; letter-spacing:6px;
    color:var(--text); font-weight:600;
  }
  .brand .word b{ color:var(--accent-strong); font-weight:700; }
  .brand .eng{ font-size:11px; letter-spacing:4px; color:var(--gold); font-weight:600; margin-top:2px; }
  .brand .rule{ width:52px; height:1px; background:var(--gold); opacity:.7; margin:10px auto 0; }

  .sub{ font-size:13px; color:var(--text-muted); margin:14px 0 18px; text-align:center; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(166,90,97,0.05); }
  .section-title{ font-size:12.5px; font-weight:700; color:var(--text-muted); letter-spacing:1px; margin:0 0 4px; }
  .section-rule{ width:22px; height:1px; background:var(--gold); opacity:.7; margin:0 0 12px; }
  .step{ display:none; }
  .step.active{ display:block; }

  /* Step 1：選擇療程 */
  .cat-tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; -webkit-overflow-scrolling:touch; }
  .cat-tab{
    flex:0 0 auto; border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    border-radius:999px; padding:8px 16px; font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .cat-tab.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .svc-list{ display:flex; flex-direction:column; gap:8px; }
  .svc-btn{
    border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:12px 14px;
    text-align:left; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .svc-btn .name{ font-size:15px; font-weight:700; }
  .svc-btn .desc{ font-size:12.5px; color:var(--text); opacity:.75; margin-top:4px; line-height:1.5; }
  .svc-btn .meta{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .svc-btn .price{ font-size:15px; font-weight:700; color:var(--accent-strong); white-space:nowrap; }
  .svc-btn.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .empty{ font-size:13px; color:var(--text-muted); }

  /* 升級體驗 */
  .addon-list{ display:flex; flex-direction:column; gap:8px; }
  .addon-item{
    border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:11px 14px;
    display:flex; align-items:center; gap:12px; cursor:pointer;
  }
  .addon-item.selected{ border-color:var(--gold); background:#FBF4E8; }
  .addon-item .check{
    width:20px; height:20px; border-radius:6px; border:1.4px solid var(--border); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff;
  }
  .addon-item.selected .check{ background:var(--gold); border-color:var(--gold); }
  .addon-item .name{ font-size:14px; font-weight:700; flex:1; }
  .addon-item .name .desc{ font-size:12px; font-weight:400; color:var(--text-muted); margin-top:3px; line-height:1.45; }
  .addon-item .price{ font-size:13.5px; font-weight:700; color:var(--gold); }

  .btn-primary{
    width:100%; color:#fff; border:none; border-radius:10px;
    background:linear-gradient(165deg, var(--accent) 0%, var(--accent-strong) 100%);
    padding:13px; font-size:15px; font-weight:700; cursor:pointer; margin-top:6px;
  }
  .btn-primary:disabled{ background:#D8B7BC; cursor:not-allowed; }

  /* Step 2：選擇時間 */
  .picked-service{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    background:var(--surface-2); border-radius:12px; padding:12px 14px; margin-bottom:14px;
  }
  .picked-service .name{ font-size:14px; font-weight:700; }
  .picked-service .addons{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .picked-service .price{ font-size:13px; color:var(--accent-strong); font-weight:700; margin-top:4px; }
  .picked-service button{
    border:none; background:none; color:var(--text-muted); font-size:12.5px; text-decoration:underline; cursor:pointer;
    padding:0; white-space:nowrap;
  }
  .week-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .week-nav button{
    border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:6px 10px;
    font-size:13px; cursor:pointer; color:var(--text);
  }
  .week-nav button:disabled{ color:var(--text-muted); cursor:not-allowed; opacity:.5; }
  .week-nav .range{ font-size:13px; font-weight:700; color:var(--text); }
  .week-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -16px; padding:0 16px; }
  .week-grid{ display:grid; grid-template-columns:44px repeat(7,minmax(56px,1fr)); gap:6px; min-width:520px; }
  .day-head{ text-align:center; font-size:12px; color:var(--text-muted); padding-bottom:4px; }
  .day-head.today .dow{ color:var(--accent-strong); font-weight:700; }
  .day-head .dow{ font-weight:700; color:var(--text); }
  .off-badge{ margin-top:2px; font-size:10px; color:var(--accent-strong); background:var(--accent-soft); border-radius:6px; padding:1px 4px; display:inline-block; }
  .time-head{ display:flex; align-items:center; justify-content:flex-end; font-size:12px; color:var(--text-muted); padding-right:4px; }
  .slot-btn{
    border:1px solid var(--border); background:var(--sage-soft); color:var(--sage); border-radius:8px;
    padding:9px 2px; font-size:12.5px; font-weight:600; cursor:pointer; width:100%;
  }
  .slot-btn.selected{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .slot-btn:disabled{ background:#EFEAEA; color:#B69EA1; cursor:not-allowed; text-decoration:line-through; }
  .slot-empty{ background:transparent; border:none; }
  input[type=text],input[type=tel]{ width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); font-size:14px; margin-top:6px; }
  label{ font-size:12.5px; color:var(--text-muted); font-weight:600; }
  .msg{ font-size:13px; margin-top:10px; padding:10px 12px; border-radius:8px; }
  .msg.error{ background:#F7E0DD; color:var(--danger); }
  .msg.success{ background:var(--sage-soft); color:var(--sage); }

  /* Step 3：預約摘要確認 */
  .summary-row{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
  .summary-row:last-child{ border-bottom:none; }
  .summary-row .k{ color:var(--text-muted); }
  .summary-row .v{ font-weight:700; text-align:right; }
  textarea{ width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); font-size:14px; margin-top:6px; font-family:inherit; resize:vertical; min-height:64px; }
  .link-btn{ background:none; border:none; color:var(--text-muted); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:0; margin-top:10px; display:inline-block; }

  /* 基本狀態諮詢問卷 */
  .intake-q{ margin-bottom:16px; }
  .intake-q:last-child{ margin-bottom:0; }
  .intake-q-title{ font-size:13.5px; font-weight:700; margin-bottom:8px; }
  .intake-opts{ display:flex; flex-wrap:wrap; gap:7px; }
  .intake-opt{
    border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:999px;
    padding:7px 13px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .intake-opt.selected{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-strong); font-weight:700; }
  .intake-other-input{ width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--border); font-size:13px; margin-top:8px; }

  /* Step 4：預約成功 */
  .success-wrap{ text-align:center; padding:20px 4px 6px; }
  .success-icon{ font-size:44px; margin-bottom:6px; }
  .success-title{ font-size:17px; font-weight:700; margin-bottom:4px; }
  .success-detail{ font-size:13px; color:var(--text-muted); margin-bottom:18px; line-height:1.7; }
  .btn-outline{
    width:100%; border:1px solid var(--accent); background:var(--surface); color:var(--accent-strong);
    border-radius:10px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; margin-top:10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="word">妍序 <b>Skin</b></div>
    <div class="eng">CUSTOMIZED SKINCARE</div>
    <div class="rule"></div>
  </div>
  <p class="sub" id="stepHint">先選擇想預約的療程，再選方便的時段</p>

  <!-- Step 1：選擇療程 -->
  <div class="step active" id="step-service">
    <div class="card">
      <p class="section-title">選擇療程</p>
      <div class="section-rule"></div>
      <div class="cat-tabs" id="catTabs"></div>
      <div class="svc-list" id="svcList">載入中...</div>
    </div>

    <div class="card" id="addonCard" style="display:none;">
      <p class="section-title">升級體驗（可複選）</p>
      <div class="section-rule"></div>
      <div class="addon-list" id="addonList"></div>
    </div>

    <button class="btn-primary" id="toStepTimeBtn" disabled>下一步：選擇時間</button>
  </div>

  <!-- Step 2：選擇時間 -->
  <div class="step" id="step-time">
    <div class="picked-service">
      <div>
        <div class="name" id="pickedName"></div>
        <div class="addons" id="pickedAddons"></div>
        <div class="price" id="pickedPrice"></div>
      </div>
      <button type="button" id="backToServiceBtn">重新選擇</button>
    </div>

    <div class="card">
      <p class="section-title">選擇時段（本週可預約）</p>
      <div class="section-rule"></div>
      <div class="week-nav">
        <button id="prevWeekBtn" type="button">‹ 上一週</button>
        <span class="range" id="weekRange"></span>
        <button id="nextWeekBtn" type="button">下一週 ›</button>
      </div>
      <div class="week-scroll">
        <div class="week-grid" id="weekGrid">載入中...</div>
      </div>
    </div>

    <button class="btn-primary" id="toStepConfirmBtn" disabled>下一步：確認預約資料</button>
  </div>

  <!-- Step 3：預約摘要確認＋填寫資料 -->
  <div class="step" id="step-confirm">
    <div class="card">
      <p class="section-title">預約摘要</p>
      <div class="section-rule"></div>
      <div class="summary-row"><span class="k">療程</span><span class="v" id="sumService"></span></div>
      <div class="summary-row" id="sumAddonsRow" style="display:none;"><span class="k">升級體驗</span><span class="v" id="sumAddons"></span></div>
      <div class="summary-row"><span class="k">日期</span><span class="v" id="sumDate"></span></div>
      <div class="summary-row"><span class="k">時段</span><span class="v" id="sumTime"></span></div>
      <div class="summary-row"><span class="k">費用</span><span class="v" id="sumPrice"></span></div>
      <button type="button" class="link-btn" id="backToTimeBtn">‹ 重新選擇時段</button>
    </div>

    <div class="card">
      <p class="section-title">您的資料</p>
      <div class="section-rule"></div>
      <label>姓名</label>
      <input type="text" id="nameInput" placeholder="您的稱呼">
      <label style="display:block;margin-top:10px;">聯絡電話</label>
      <input type="tel" id="phoneInput" placeholder="0912345678">
      <label style="display:block;margin-top:10px;">備註（選填）</label>
      <textarea id="noteInput" placeholder="有什麼想先告訴店家的嗎？（例如第一次來、想加強的部位等等）"></textarea>
    </div>

    <div class="card" id="intakeCard" style="display:none;">
      <p class="section-title">基本狀態諮詢</p>
      <div class="section-rule"></div>
      <p style="font-size:12px; color:var(--text-muted); margin:-6px 0 12px;">幫助店家更了解您的膚況，讓服務更貼合需求</p>
      <div id="intakeQuestions"></div>
    </div>

    <button class="btn-primary" id="submitBtn">確認預約</button>
    <div id="resultMsg"></div>
  </div>

  <!-- Step 4：預約成功 -->
  <div class="step" id="step-success">
    <div class="card success-wrap">
      <div class="success-icon">🤍</div>
      <div class="success-title">預約成功！</div>
      <div class="success-detail" id="successDetail"></div>
      <button type="button" class="btn-primary" id="addToCalendarBtn">加入我的行事曆</button>
      <button type="button" class="btn-outline" id="viewMyBookingsBtn">查看我的預約</button>
    </div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
